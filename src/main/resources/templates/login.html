<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-card">
        <div class="brand auth-card__brand">
            <div class="brand__logo">W</div>
            <div>
                <p class="brand__caption auth-card__caption">Warehouse accounting</p>
                <h1 class="brand__title auth-card__title">Sign in</h1>
            </div>
        </div>

        <p class="auth-card__text">Use your login and password to access the warehouse application.</p>

        <div class="alert alert--error" th:if="${param.error}">
            Invalid login or password.
        </div>
        <div class="alert alert--success" th:if="${param.logout}">
            You have been signed out.
        </div>

        <form class="form-grid" method="post" th:action="@{/login}">
            <label class="form-grid__full">
                Login
                <input type="text" name="login" autocomplete="username">
            </label>
            <label class="form-grid__full">
                Password
                <input type="password" name="password" autocomplete="current-password">
            </label>
            <div class="form-actions form-grid__full">
                <button class="btn btn--primary" type="submit">Sign in</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
