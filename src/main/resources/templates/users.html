<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Пользователи')}"></head>
<body>
<div th:replace="~{fragments :: shell(${activePage}, 'Пользователи')}"></div>

<main class="content content--overlay">
    <div class="stack stack--two-columns">
        <section class="card">
            <div class="card__header">
                <div>
                    <h3>Создать пользователя</h3>
                    <p>Добавьте нового пользователя склада и назначьте ему роль.</p>
                </div>
            </div>

            <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert--error" th:if="${formError}" th:text="${formError}"></div>

            <form class="form-grid" method="post" th:action="@{/users}" th:object="${userForm}">
                <label>
                    Логин
                    <input type="text" th:field="*{login}">
                </label>
                <label>
                    Имя
                    <input type="text" th:field="*{name}">
                </label>
                <label>
                    Пароль
                    <input type="password" th:field="*{password}">
                </label>
                <label>
                    Роль
                    <select th:field="*{roleName}">
                        <option value="">Выберите роль</option>
                        <option th:each="role : ${roles}" th:value="${role.name}" th:text="${role.name}"></option>
                    </select>
                </label>
                <div class="form-actions form-grid__full">
                    <button class="btn btn--primary" type="submit">Создать пользователя</button>
                </div>
            </form>
        </section>

        <section class="card card--full">
            <div class="card__header">
                <div>
                    <h3>Пользователи</h3>
                    <p>Существующие пользователи приложения. Хеши паролей не отображаются.</p>
                </div>
                <div class="card__actions">
                    <span class="badge" th:text="'Пользователей: ' + ${#lists.size(users)}"></span>
                    <a class="btn" th:href="@{/users}">Обновить</a>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(users)}">
                Пользователи не найдены.
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(users)}">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>Имя</th>
                        <th>Роль</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.login}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.role.name}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
